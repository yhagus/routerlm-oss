# Development stack: `docker compose up -d`
#   backend -> http://localhost:3000
#   web     -> http://localhost:3001
#   db      -> postgres://routerlm:routerlm@localhost:5432/routerlm
#   redis   -> redis://localhost:6379
#   worker  -> runs queue jobs, no port
#   migrate -> one-shot: applies migrations and seeds the Catalog, then exits
#
# Every value below has a development default. Override any of them in `.env`
# next to this file (see .env.example). Only ENCRYPTION_KEY has no default:
# generate it once with `openssl rand -base64 32` and keep it, because losing
# it makes stored Provider Account keys unreadable.

x-postgres: &postgres
  POSTGRES_USER: ${POSTGRES_USER:-routerlm}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routerlm}
  POSTGRES_DB: ${POSTGRES_DB:-routerlm}

# Shared by backend, worker and migrate. Hostnames are compose service names.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-routerlm}:${POSTGRES_PASSWORD:-routerlm}@db:5432/${POSTGRES_DB:-routerlm}
  REDIS_URL: redis://redis:6379
  WEB_ORIGIN: http://localhost:${WEB_PORT:-3001}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env to the output of `openssl rand -base64 32` (see README)}
  ERROR_CAPTURE_RETENTION_DAYS: ${ERROR_CAPTURE_RETENTION_DAYS:-7}
  ALLOW_PRIVATE_UPSTREAMS: ${ALLOW_PRIVATE_UPSTREAMS:-false}

services:
  db:
    image: postgres:18-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment: *postgres
    volumes:
      # Postgres 18+ images keep PGDATA in a versioned subdirectory
      # (/var/lib/postgresql/18/docker), so mount the parent directory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applies pending migrations, then creates missing Catalog rows. Both are
  # idempotent, so this runs on every `docker compose up`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    environment: *app-env
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run db:migrate && bun run db:seed"]
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      <<: *app-env
      PORT: 3000
    volumes:
      - .:/app
      # Keep the container's Linux node_modules instead of the host's.
      - backend_node_modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      # The backend survives Redis outages, so starting it is enough.
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment: *app-env
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_BACKEND_URL: http://backend:3000
      # The gateway address the docs' examples show. Empty: the browser's host on port 3000.
      NUXT_PUBLIC_GATEWAY_URL: ${NUXT_PUBLIC_GATEWAY_URL:-}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  worker_node_modules:
  web_node_modules:
