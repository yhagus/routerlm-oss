# Development stack: `docker compose up -d`
#   backend -> http://localhost:3000
#   web     -> http://localhost:3001
#   db      -> postgres://routerlm:routerlm@localhost:5432/routerlm
#   redis   -> redis://localhost:6379
#   worker  -> runs queue jobs, no port
services:
  db:
    image: postgres:18-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: routerlm
      POSTGRES_PASSWORD: routerlm
      POSTGRES_DB: routerlm
    volumes:
      # Postgres 18+ images keep PGDATA in a versioned subdirectory
      # (/var/lib/postgresql/18/docker), so mount the parent directory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routerlm -d routerlm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://routerlm:routerlm@db:5432/routerlm
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3001}
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      # Keep the container's Linux node_modules instead of the host's.
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      # The backend survives Redis outages, so starting it is enough.
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://routerlm:routerlm@db:5432/routerlm
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_BACKEND_URL: http://backend:3000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  worker_node_modules:
  web_node_modules:
