# Development stack: `docker compose up -d`
#
# The same split as deploy/compose.yaml (ADR 0094), with hot reload and
# without TLS or hostnames: Caddy routes by port and path instead.
#   caddy     -> http://localhost:3000  /v1/*, /health -> inference
#                                       /integration/v1/* -> admin
#                                       anything else -> 404
#                http://localhost:3001  -> web
#   inference -> BACKEND_ROLE=inference, reloads on change, no host port
#   admin     -> BACKEND_ROLE=admin, reloads on change, no host port
#   web       -> nuxt dev; reaches admin's /api on the compose network only
#   db        -> postgres://routerlm:routerlm@localhost:5432/routerlm
#   redis     -> redis://localhost:6379
#   worker    -> runs queue jobs; gRPC control plane on 127.0.0.1:50051
#   migrate   -> one-shot: applies migrations and seeds the Catalog, then exits
#
# Every value below has a development default. Override any of them in `.env`
# next to this file (see .env.example). Only ENCRYPTION_KEY has no default:
# generate it once with `openssl rand -base64 32` and keep it, because losing
# it makes stored Provider Account keys unreadable.

x-postgres: &postgres
  POSTGRES_USER: ${POSTGRES_USER:-routerlm}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routerlm}
  POSTGRES_DB: ${POSTGRES_DB:-routerlm}

# Shared by inference, admin, worker and migrate. Hostnames are compose service
# names. Only Caddy reaches the role containers, so the compose subnet is the
# only X-Forwarded-For source they trust.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-routerlm}:${POSTGRES_PASSWORD:-routerlm}@db:5432/${POSTGRES_DB:-routerlm}
  REDIS_URL: redis://redis:6379
  WEB_ORIGIN: http://localhost:${WEB_PORT:-3001}
  TRUST_PROXY: ${ROUTERLM_SUBNET:-172.29.84.0/24}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env to the output of `openssl rand -base64 32` (see README)}
  SNAPSHOT_RELOAD_INTERVAL_MS: ${SNAPSHOT_RELOAD_INTERVAL_MS:-30000}
  ERROR_CAPTURE_RETENTION_DAYS: ${ERROR_CAPTURE_RETENTION_DAYS:-7}

x-backend-dev: &backend-dev
  build:
    context: .
    dockerfile: Dockerfile
    target: backend
  volumes:
    - .:/app
    # Keep the container's Linux node_modules instead of the host's.
    - backend_node_modules:/app/node_modules
  depends_on:
    migrate:
      condition: service_completed_successfully
    # The backend survives Redis outages, so starting it is enough.
    redis:
      condition: service_started
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${BACKEND_PORT:-3000}:3000"
      - "${WEB_PORT:-3001}:3001"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - inference
      - admin
      - web
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment: *postgres
    volumes:
      # Postgres 18+ images keep PGDATA in a versioned subdirectory
      # (/var/lib/postgresql/18/docker), so mount the parent directory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applies pending migrations, then creates missing Catalog rows. Both are
  # idempotent, so this runs on every `docker compose up`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    environment: *app-env
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run db:migrate && bun run db:seed"]
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  inference:
    <<: *backend-dev
    environment:
      <<: *app-env
      PORT: 3000
      BACKEND_ROLE: inference

  admin:
    <<: *backend-dev
    environment:
      <<: *app-env
      PORT: 3000
      BACKEND_ROLE: admin

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    # The control plane over gRPC (plaintext h2c), on the host's loopback only.
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-50051}:50051"
    environment:
      <<: *app-env
      CONTROL_PLANE_PORT: 50051
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_BACKEND_URL: http://admin:3000
      # The gateway address the docs' examples show. Empty: the browser's host on port 3000.
      NUXT_PUBLIC_GATEWAY_URL: ${NUXT_PUBLIC_GATEWAY_URL:-}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - admin
    restart: unless-stopped

# The routes of deploy/compose.yaml's Caddyfile, always over plain HTTP on
# ports 3000 and 3001. Keep the two in step.
configs:
  caddyfile:
    content: |
      {
      	auto_https off
      }

      :3000 {
      	@inference path /v1/* /health
      	handle @inference {
      		reverse_proxy {
      			dynamic a inference 3000 {
      				refresh 5s
      			}
      			lb_policy least_conn
      			lb_try_duration 5s
      			fail_duration 30s
      		}
      	}
      	handle /integration/v1/* {
      		reverse_proxy admin:3000
      	}
      	handle {
      		respond 404
      	}
      }

      :3001 {
      	reverse_proxy web:3000
      }

networks:
  default:
    ipam:
      config:
        - subnet: ${ROUTERLM_SUBNET:-172.29.84.0/24}

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  backend_node_modules:
  worker_node_modules:
  web_node_modules:
