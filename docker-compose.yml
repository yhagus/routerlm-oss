# Development stack: `docker compose up -d`
#   backend -> http://localhost:3000
#   web     -> http://localhost:3001
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      PORT: 3000
    volumes:
      - .:/app
      # Keep the container's Linux node_modules instead of the host's.
      - backend_node_modules:/app/node_modules
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_node_modules:
  web_node_modules:
