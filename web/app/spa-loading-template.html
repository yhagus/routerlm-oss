<!--
  Full-screen boot screen shown until the client app mounts (ssr: false).
  main.css is not loaded yet, so colors are inlined; data-theme is already
  set on <html> by the theme boot script in nuxt.config.ts. The fade-out on
  handoff is driven by app/plugins/00.spa-loader.client.ts.
-->
<div class="rlm-boot" role="status" aria-live="polite">
  <span class="rlm-boot__mark" aria-hidden="true">R</span>
  <div class="rlm-boot__progress" aria-hidden="true"><i></i></div>
  <p class="rlm-boot__label">Loading RouterLM</p>
  <style>
    .rlm-boot {
      --boot-paper: #f5f5f7;
      --boot-muted: #6e6e73;
      --boot-track: #e3e3e8;
      --boot-bar: #aeaeb2;
      --boot-mark: #e5e5ea;
      --boot-mark-ink: #1d1d1f;
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      background: var(--boot-paper);
      font-family:
        'Plus Jakarta Sans Variable', 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: opacity 0.22s ease-out;
    }
    .rlm-boot.is-done {
      opacity: 0;
      pointer-events: none;
    }
    :root[data-theme='dark'] .rlm-boot {
      --boot-paper: #0b0b0c;
      --boot-muted: #a1a1a6;
      --boot-track: #333336;
      --boot-bar: #8e8e93;
      --boot-mark: linear-gradient(180deg, #5a5a5e, #3a3a3c);
      --boot-mark-ink: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) .rlm-boot {
        --boot-paper: #0b0b0c;
        --boot-muted: #a1a1a6;
        --boot-track: #333336;
        --boot-bar: #8e8e93;
        --boot-mark: linear-gradient(180deg, #5a5a5e, #3a3a3c);
        --boot-mark-ink: #ffffff;
      }
    }
    .rlm-boot__mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--boot-mark);
      color: var(--boot-mark-ink);
      font-size: 18px;
      font-weight: 700;
    }
    .rlm-boot__progress {
      position: relative;
      width: 140px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--boot-track);
    }
    .rlm-boot__progress i {
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      border-radius: inherit;
      background: var(--boot-bar);
      animation: rlm-boot-sweep 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    .rlm-boot__label {
      margin: 0;
      color: var(--boot-muted);
      font-size: 12px;
    }
    @keyframes rlm-boot-sweep {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(250%);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .rlm-boot {
        transition: none;
      }
      .rlm-boot__progress i {
        width: 100%;
        animation: rlm-boot-pulse 1.6s ease-in-out infinite alternate;
      }
      @keyframes rlm-boot-pulse {
        from {
          opacity: 0.35;
        }
        to {
          opacity: 1;
        }
      }
    }
  </style>
</div>
