# Performance test stack: `bun run perf:k6` (see README.md).
#
# Builds the production image, so the numbers match what ships. The gateway
# (`backend`) is the "VM": it gets at most 2 CPUs and 2 GB of RAM. Nothing is
# published to the host, and the project has its own name, volumes and
# network, so it never touches the dev stack in the root docker-compose.yml.
name: routerlm-oss-k6

x-app-env: &app-env
  DATABASE_URL: postgres://routerlm:routerlm@db:5432/routerlm
  REDIS_URL: redis://redis:6379
  # A fixed, throwaway key: it only encrypts the fake Provider Account key.
  ENCRYPTION_KEY: dGVzdC1vbmx5LWVuY3J5cHRpb24ta2V5LTMyLWJ5dGU=

# One image for backend, worker and migrate. Only `backend` builds it (run.sh
# builds it first), so the three never build the same tag at once.
x-backend-image: &backend-image
  image: routerlm-oss-k6-backend

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: routerlm
      POSTGRES_PASSWORD: routerlm
      POSTGRES_DB: routerlm
    # Every run starts empty.
    tmpfs:
      - /var/lib/postgresql
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U routerlm -d routerlm']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *backend-image
    command: ['bun', 'dist/migrate.js']
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  # Inserts the Models, Routes and API Key the k6 scripts call. Runs from the
  # `base` stage (full source) because the production image holds only dist/.
  seed:
    image: routerlm-oss-k6-seed
    build:
      context: ../..
      dockerfile: Dockerfile
      target: base
    command: ['bun', 'tests/k6/seed.ts']
    environment:
      <<: *app-env
      PERF_API_KEY: ${PERF_API_KEY:-rlm_0123456789abcdef_perfperfperfperfperfperfperfperfperfperfper}
      UPSTREAM_ORIGIN: http://fake-upstream:4000
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Plays every Provider, with a fixed latency and a streamed answer.
  fake-upstream:
    image: oven/bun:1.4-slim
    command: ['bun', '/app/fake-upstream.js']
    environment:
      PORT: 4000
      UPSTREAM_LATENCY_MS: ${UPSTREAM_LATENCY_MS:-200}
      TOKENS_PER_SECOND: ${TOKENS_PER_SECOND:-100}
      OUTPUT_TOKENS: ${OUTPUT_TOKENS:-200}
      INSTANT_OUTPUT_TOKENS: ${INSTANT_OUTPUT_TOKENS:-20}
    # Test equipment, not part of the system under test.
    cpus: 1
    mem_limit: 512m
    volumes:
      - ./fake-upstream.js:/app/fake-upstream.js:ro
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30

  # The one-VM budget, as ONE process: 2 CPUs, 2 GB, no swap. The gateway is a
  # single event loop, so it can use only one of the two CPUs. TOPOLOGY=single.
  backend:
    <<: *backend-image
    profiles: [single]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    environment:
      <<: *app-env
      PORT: 3000
      # Bun allows only 256 simultaneous outbound requests per process by default,
      # which caps the gateway at about 256 / answer-time req/s whatever its CPU
      # (measured: 107 req/s for one process with the paced upstream).
      BUN_CONFIG_MAX_HTTP_REQUESTS: ${BUN_CONFIG_MAX_HTTP_REQUESTS:-4096}
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      fake-upstream:
        condition: service_healthy

  # The same budget, as TWO processes of 1 CPU and 1 GB each behind a load
  # balancer, so both CPUs work. TOPOLOGY=dual (the default).
  backend-a: &backend-replica
    <<: *backend-image
    profiles: [dual]
    environment:
      <<: *app-env
      PORT: 3000
      # Bun allows only 256 simultaneous outbound requests per process by default,
      # which caps the gateway at about 256 / answer-time req/s whatever its CPU
      # (measured: 107 req/s for one process with the paced upstream).
      BUN_CONFIG_MAX_HTTP_REQUESTS: ${BUN_CONFIG_MAX_HTTP_REQUESTS:-4096}
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      fake-upstream:
        condition: service_healthy

  backend-b:
    <<: *backend-replica

  # The same budget as `backend`, with the gateway running two processes on one
  # port (ADR 0025), so both CPUs work without a load balancer. TOPOLOGY=cluster.
  backend-cluster:
    <<: *backend-replica
    profiles: [cluster]
    environment:
      <<: *app-env
      PORT: 3000
      BACKEND_PROCESSES: 2
      # Bun allows only 256 simultaneous outbound requests per process by default,
      # which caps the gateway at about 256 / answer-time req/s whatever its CPU
      # (measured: 107 req/s for one process with the paced upstream).
      BUN_CONFIG_MAX_HTTP_REQUESTS: ${BUN_CONFIG_MAX_HTTP_REQUESTS:-4096}
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g

  # Not part of the budget: it only spreads connections over the two replicas.
  lb:
    image: nginx:alpine
    profiles: [dual]
    # Test equipment: it only spreads connections over the two replicas.
    cpus: 1
    mem_limit: 256m
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      backend-a:
        condition: service_healthy
      backend-b:
        condition: service_healthy

  worker:
    <<: *backend-image
    command: ['bun', 'dist/worker.js']
    environment: *app-env
    cpus: 1
    mem_limit: 1g
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    # Root, so the mounted results folder is writable on Linux hosts too.
    user: root
    command: ['run', '--summary-export=/results/summary.json', '/scripts/gateway.js']
    environment:
      # run.sh sets BASE_URL for the topology.
      BASE_URL: ${BASE_URL:-http://lb:8080}
      PERF_API_KEY: ${PERF_API_KEY:-rlm_0123456789abcdef_perfperfperfperfperfperfperfperfperfperfper}
      PROFILE: ${PROFILE:-smoke}
      SCENARIO: ${SCENARIO:-mixed}
      VUS: ${VUS:-300}
      BENCH_RAW_VUS: ${BENCH_RAW_VUS:-300}
      BENCH_MIXED_VUS: ${BENCH_MIXED_VUS:-1800}
      DURATION: ${DURATION:-3m}
      UPSTREAM_LATENCY_MS: ${UPSTREAM_LATENCY_MS:-200}
      TOKENS_PER_SECOND: ${TOKENS_PER_SECOND:-100}
      OUTPUT_TOKENS: ${OUTPUT_TOKENS:-200}
    volumes:
      - ./scripts:/scripts:ro
      - ./results:/results
