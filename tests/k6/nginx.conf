# Spreads the k6 traffic over the two gateway replicas (TOPOLOGY=dual).
worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
}

http {
  access_log off;

  upstream gateway {
    least_conn;
    server backend-a:3000;
    server backend-b:3000;
    keepalive 512;
  }

  server {
    listen 8080;
    # Above the gateway's 20 MB limit, so the gateway is what refuses a bigger body.
    client_max_body_size 30m;

    location / {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Streams must pass through as they arrive.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }
}
