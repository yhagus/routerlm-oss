# Throwaway services for the feature tests: `bun run test:docker`, which gives
# each run its own project name (-p) and free host ports through TEST_DB_PORT
# and TEST_REDIS_PORT, so it never collides with the dev stack in
# docker-compose.yml or with a run in another worktree. Run by hand, it
# defaults to 55432 (Postgres) and 56379 (Redis). Postgres keeps its data in
# tmpfs and Redis persists nothing: every run starts empty.
name: routerlm-oss-test

services:
  db:
    image: postgres:18-alpine
    ports:
      - "${TEST_DB_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: routerlm
      POSTGRES_PASSWORD: routerlm
      POSTGRES_DB: routerlm
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routerlm -d routerlm"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${TEST_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
