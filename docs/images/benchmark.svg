<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="880" height="400" rx="14" fill="#0f172a"/>
<text x="32" y="44" font-size="20" font-weight="700" fill="#f8fafc">RouterLM under load: end-to-end scenario</text>
<text x="32" y="68" font-size="13" fill="#94a3b8">k6, 60 s, 2.2 s upstream answer, Apple M3 Pro in Docker (4 CPUs). Gateway: 2 replicas of 1 CPU.</text>
<rect x="32" y="90" width="152" height="78" rx="10" fill="#1e293b"/><text x="108" y="130" font-size="28" font-weight="700" text-anchor="middle" fill="#f8fafc">1,800</text><text x="108" y="153" font-size="12" text-anchor="middle" fill="#94a3b8">virtual users</text>
<rect x="196" y="90" width="152" height="78" rx="10" fill="#1e293b"/><text x="272" y="130" font-size="28" font-weight="700" text-anchor="middle" fill="#f8fafc">444</text><text x="272" y="153" font-size="12" text-anchor="middle" fill="#94a3b8">requests / s</text>
<rect x="360" y="90" width="152" height="78" rx="10" fill="#1e293b"/><text x="436" y="130" font-size="28" font-weight="700" text-anchor="middle" fill="#4ade80">0</text><text x="436" y="153" font-size="12" text-anchor="middle" fill="#94a3b8">failed requests</text>
<rect x="524" y="90" width="152" height="78" rx="10" fill="#1e293b"/><text x="600" y="130" font-size="28" font-weight="700" text-anchor="middle" fill="#f8fafc">3.31 s</text><text x="600" y="153" font-size="12" text-anchor="middle" fill="#94a3b8">median latency</text>
<rect x="688" y="90" width="152" height="78" rx="10" fill="#1e293b"/><text x="764" y="130" font-size="28" font-weight="700" text-anchor="middle" fill="#f8fafc">6.01 s</text><text x="764" y="153" font-size="12" text-anchor="middle" fill="#94a3b8">p95 latency</text>
<text x="32" y="210" font-size="14" font-weight="600" fill="#e2e8f0">Average CPU use, as a share of each node's limit</text>
<text x="32" y="249" font-size="13" fill="#cbd5e1">Gateway (2 replicas)</text><rect x="200" y="232" width="520" height="24" rx="6" fill="#1e293b"/><rect x="200" y="232" width="348" height="24" rx="6" fill="#38bdf8"/><text x="556" y="249" font-size="13" font-weight="600" text-anchor="start" fill="#f8fafc">67%</text><text x="740" y="249" font-size="12" fill="#94a3b8">1.34 cores · 528 MiB</text>
<text x="32" y="287" font-size="13" fill="#cbd5e1">PostgreSQL</text><rect x="200" y="270" width="520" height="24" rx="6" fill="#1e293b"/><rect x="200" y="270" width="182" height="24" rx="6" fill="#38bdf8"/><text x="390" y="287" font-size="13" font-weight="600" text-anchor="start" fill="#f8fafc">35%</text><text x="740" y="287" font-size="12" fill="#94a3b8">0.35 cores · 124 MiB</text>
<text x="32" y="325" font-size="13" fill="#cbd5e1">Worker</text><rect x="200" y="308" width="520" height="24" rx="6" fill="#1e293b"/><rect x="200" y="308" width="135" height="24" rx="6" fill="#38bdf8"/><text x="343" y="325" font-size="13" font-weight="600" text-anchor="start" fill="#f8fafc">26%</text><text x="740" y="325" font-size="12" fill="#94a3b8">0.26 cores · 85 MiB</text>
<text x="32" y="363" font-size="13" fill="#cbd5e1">Redis</text><rect x="200" y="346" width="520" height="24" rx="6" fill="#1e293b"/><rect x="200" y="346" width="104" height="24" rx="6" fill="#38bdf8"/><text x="312" y="363" font-size="13" font-weight="600" text-anchor="start" fill="#f8fafc">20%</text><text x="740" y="363" font-size="12" fill="#94a3b8">0.10 cores · 15 MiB</text>
<text x="32" y="388" font-size="11" fill="#64748b">Fake upstream, so the numbers show the cost of RouterLM, not of a Provider. Results can vary by about 20% between runs.</text></svg>
