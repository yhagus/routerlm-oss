name: Download badges

# GitHub has no API for container download counts, so read the total from
# the GHCR package page and publish it as a shields.io endpoint file on the
# "badges" branch. The npm badge needs none of this: shields reads npm directly.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Read the GHCR download count
        id: count
        run: |
          page="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pkgs/container/${GITHUB_REPOSITORY#*/}"
          # The exact total sits in the title attribute of the heading after "Total downloads".
          count="$(curl -fsSL "$page" | tr '\n' ' ' \
            | sed -nE 's/.*Total downloads<\/span>[[:space:]]*<h3 title="([0-9,]+)".*/\1/p' | head -1)"
          if [ -z "$count" ]; then
            echo "::error::Could not find the download count on $page"
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # The branch holds only the badge file, so a single force-pushed commit is enough.
      - name: Publish the badge file
        env:
          COUNT: ${{ steps.count.outputs.count }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir badges && cd badges
          git init -q -b badges
          printf '{"schemaVersion":1,"label":"ghcr downloads","message":"%s","color":"blue","namedLogo":"github"}\n' "$COUNT" > ghcr-downloads.json
          git add ghcr-downloads.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Update download badges"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
