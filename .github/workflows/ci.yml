name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs CI on the tagged commit before it builds images.
  workflow_call:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: routerlm
          POSTGRES_PASSWORD: routerlm
          POSTGRES_DB: routerlm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routerlm -d routerlm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://routerlm:routerlm@localhost:5432/routerlm
      TEST_DATABASE_URL: postgres://routerlm:routerlm@localhost:5432/routerlm_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Generate a throwaway ENCRYPTION_KEY
        run: echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: bun run check
      - run: bun run test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The web linter's type-aware mode runs oxlint-tsgolint from the root
      # node_modules.
      - name: Install root dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
