name: npm package

# A version tag is the only release gate, as for the Docker image.
# The package version comes from the tag: v1.3.0 publishes @ciwergrp/routerlm@1.3.0.
# Scoped packages are private by default, hence --access public.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # vue-tsc needs real Node.js (see Dockerfile); setup-node also writes the
      # registry auth that `npm publish` reads from NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Build package
        run: |
          bun run build:frontend
          node cli/scripts/build.mjs "${GITHUB_REF_NAME#v}"

      - name: Smoke test
        working-directory: cli/dist
        run: |
          test "$(node cli.js --version)" = "${GITHUB_REF_NAME#v}"
          npm pack --dry-run

      # Prereleases (v1.3.0-beta.1) go to the "next" dist-tag so `npm i -g @ciwergrp/routerlm`
      # keeps installing the latest stable release.
      - name: Publish
        working-directory: cli/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          npm publish --access public --provenance --tag "$dist_tag"
