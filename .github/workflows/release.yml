# Publishes a release when a vX.Y.Z tag is pushed:
#   1. CI on the tagged commit, and the tag checked against both package.json versions
#   2. per architecture, on a native runner: build both images, boot
#      deploy/compose.yaml against them (scripts/smoke-production.sh), then
#      push them by digest
#   3. merge the digests into multi-arch tags (2.1.0, 2.1, 2, latest) and
#      attest their provenance
#   4. create the GitHub Release from the CHANGELOG section, with compose.yaml
#      pinned to this version and env.example attached
# See ADR 0018.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/routerlm-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/routerlm-web

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Check the tag against package.json and the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in package.json web/package.json; do
            declared="$(jq -r .version "$file")"
            if [ "$declared" != "$version" ]; then
              echo "::error file=$file::version is $declared, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          if ! grep -qE "^# v${version//./\\.}( |$)" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '# v$version' section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  build:
    needs: [ci, version]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name the platform for artifacts and cache scopes
        run: echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the backend image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:smoke
          cache-from: type=gha,scope=backend-${{ env.ARCH }}
          cache-to: type=gha,scope=backend-${{ env.ARCH }},mode=max
      - name: Build the web image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          target: production
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.WEB_IMAGE }}:smoke
          cache-from: type=gha,scope=web-${{ env.ARCH }}
          cache-to: type=gha,scope=web-${{ env.ARCH }},mode=max

      - name: Smoke-test deploy/compose.yaml
        run: scripts/smoke-production.sh
        env:
          ROUTERLM_VERSION: smoke

      # Rebuilt from the cache just filled, so these are the images that passed.
      - name: Push the backend image by digest
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.BACKEND_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backend-${{ env.ARCH }}
      - name: Push the web image by digest
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          target: production
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.WEB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=web-${{ env.ARCH }}

      - name: Record the digests
        run: |
          mkdir -p digests/backend digests/web
          touch "digests/backend/${BACKEND_DIGEST#sha256:}" "digests/web/${WEB_DIGEST#sha256:}"
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.ARCH }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [backend, web]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pick the image name
        run: echo "IMAGE=$( [ "$NAME" = backend ] && echo "$BACKEND_IMAGE" || echo "$WEB_IMAGE" )" >> "$GITHUB_ENV"
        env:
          NAME: ${{ matrix.image }}
      # A prerelease tag only gets its exact version; latest and the minor and
      # major tags follow final releases.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Create the multi-arch tags
        working-directory: digests/${{ matrix.image }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - id: digest
        name: Read the multi-arch digest
        run: |
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the GitHub Release
        run: |
          mkdir -p release
          # compose.yaml pinned to this release's images.
          sed "s/ROUTERLM_VERSION:-latest}/ROUTERLM_VERSION:-$VERSION}/g" deploy/compose.yaml > release/compose.yaml
          if grep -q 'ROUTERLM_VERSION:-latest' release/compose.yaml; then
            echo "::error::compose.yaml still points at latest"; exit 1
          fi
          cp deploy/.env.example release/env.example
          # The CHANGELOG section of this version, without its heading.
          awk -v heading="# v$VERSION" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^# / { exit }
            found { print }
          ' CHANGELOG.md > release/notes.md
          prerelease_flag=()
          if [ "$PRERELEASE" = true ]; then prerelease_flag=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release/notes.md \
            --verify-tag \
            "${prerelease_flag[@]}" \
            release/compose.yaml release/env.example
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
